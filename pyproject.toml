[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "noteforge"
version = "0.1.0"
description = "A Python package for generating structured notes from transcripts using LLMs."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

authors = [
    { name = "Amar" }
]

keywords = [
    "llm",
    "notes",
    "transcript",
    "ai",
    "markdown",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

[tool.mypy]
python_version = "3.12"

strict = true

warn_unused_configs = true

warn_return_any = true

warn_unused_ignores = true

show_error_codes = true

dependencies = [
    "pydantic>=2.11",
]

[tool.pytest.ini_options]

testpaths = [
    "tests",
]

pythonpath = [
    "src",
]

addopts = [
    "--strict-markers",
    "--cov=noteforge",
    "--cov-report=term-missing",
]

[project.optional-dependencies]

ignore = []

docling = [
    "docling"
]

openai = [
    "openai"
]

nim = [
]

dev = [
    "pre-commit>=4.2",
    "ruff>=0.12",
    "mypy>=1.17",
    "pytest>=8.4",
    "pytest-cov>=6.2",
]

[project.urls]
Homepage = "https://github.com/amar8737/NoteForge"
Repository = "https://github.com/amar8737/NoteForge"
Issues = "https://github.com/amar8737/NoteForge/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/noteforge"]
